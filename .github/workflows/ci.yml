# Continuous integration for the fork.
#
# What happens on every push:
#   1. the unit tests of the shared module run (time calculation, data model),
#   2. a debug APK is built,
#   3. the APK is attached to the workflow run (artifact). For pushes to master (and builds started
#      by hand) it is also published as a "pre-release" on the Releases page, so it can be
#      downloaded directly on a phone.
#
# To install a build: open the repository on GitHub -> Releases -> newest entry -> tap the .apk file.
name: Android CI

on:
  push:
  pull_request:
    types: [opened, reopened]
  # Allows starting a build by hand from the "Actions" tab.
  workflow_dispatch:

# "contents: write" is needed so that the workflow may create the release entry.
permissions:
  contents: write

jobs:
  # Checks the store listing texts in /fastlane (inherited from the original project).
  fastlane-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@v1

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    # The Android Gradle Plugin used by this project (7.3.x) needs JDK 11.
    - name: set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Fails the build (and therefore the release) if the time calculation or the data model break.
    # The output is also written to gradle-*.log, so that errors can be shown as annotations
    # (see "Show build errors" below).
    - name: Run unit tests
      run: |
        set -o pipefail
        ./gradlew :shared:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

    # Counts the executed tests and shows the result as a note on the run page. Fails if no test ran
    # at all, so a misconfigured test setup can not go unnoticed.
    - name: Summarize unit tests
      if: always()
      run: |
        python3 - <<'PY'
        import glob, sys, xml.etree.ElementTree as ET
        tests = failures = skipped = 0
        for f in glob.glob("shared/build/test-results/testDebugUnitTest/*.xml"):
            r = ET.parse(f).getroot()
            tests += int(r.get("tests", 0))
            failures += int(r.get("failures", 0)) + int(r.get("errors", 0))
            skipped += int(r.get("skipped", 0))
            for case in r.iter("testcase"):
                for bad in list(case.iter("failure")) + list(case.iter("error")):
                    text = (bad.get("message") or "").replace("%", "%25").replace("\n", "%0A")[:400]
                    print(f"::error title=Test failed::{case.get('classname')}.{case.get('name')}: {text}")
        msg = f"{tests} tests, {failures} failed, {skipped} skipped"
        print(f"::notice title=Unit tests::{msg}")
        with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as s:
            s.write(f"### Unit tests\n{msg}\n")
        sys.exit(1 if tests == 0 or failures else 0)
        PY

    - name: Build debug APK
      run: |
        set -o pipefail
        ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log

    # On failure: copies the compiler / resource errors into one annotation on the run page, so
    # they can be read without downloading the full log.
    - name: Show build errors
      if: failure()
      run: |
        cat gradle-*.log 2>/dev/null \
          | grep -E "^e: |error:|ERROR:|What went wrong|AAPT: error|FAILED|> " \
          | grep -v "^> Task" | head -40 > errors.txt || true
        if [ -s errors.txt ]; then
          echo "::error title=Build errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' errors.txt)"
        fi

    # Keep the test report when something fails, to find out why.
    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: test-report
        path: shared/build/reports/tests/

    - name: Upload APK as workflow artifact
      uses: actions/upload-artifact@v5
      with:
        name: Sobriety-Neo-debug-apk
        path: app/build/outputs/apk/*/debug/*.apk

    # Publishes the APK on the Releases page, for pushes to master and for builds started by hand
    # ("Run workflow" in the Actions tab, which also works for other branches). Pushes to other
    # branches only keep the APK as a workflow artifact, so the Releases page is not flooded.
    - name: Publish pre-release with the APK
      if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ github.sha }}
        name: Build ${{ github.run_number }} (${{ github.ref_name }})
        prerelease: true
        files: app/build/outputs/apk/*/debug/*.apk
        body: |
          Test build of branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
          Two variants (download one or both, they can be installed side by side):
          - `...-neo-debug.apk`: Sobriety Neo with the new look (main app)
          - `...-classic-debug.apk`: Sobriety Neo Classic, the original look
          Download the `.apk` file below and install it on an Android phone.
          The app can be installed next to the original Sobriety app. Use "Export" in the
          settings of the old app and "Import" in this one to take your data along.
